_target_: src.model.operator_uncertainty_fusion.OperatorHypothesisUncertaintyFusion

proposal:
  _target_: src.model.psf_free_drunet.PSFFreeDRUNet
  channels: 3
  nc: [32, 64, 128, 256]
  depth: 4
  noise_level: 1.0
  trainable_noise_level: true
  checkpoint_path: ${oc.env:OHUF_PSF_FREE_CHECKPOINT,./saved/ohuf-psf-free-real-68/checkpoint-epoch10.pth}
  strict_checkpoint: true
  output_crop: [80, 100, 200, 266]
  output_normalization: positive_max

psf_reconstructor:
  _target_: src.model.psf_aware_drunet.PSFAwareDRUNet
  channels: 3
  nc: [32, 64, 128, 256]
  depth: 4
  noise_level: 1.0
  trainable_noise_level: true
  checkpoint_path: ${oc.env:OHUF_PSF_AWARE_CHECKPOINT,./saved/ohuf-psf-aware-real-68/checkpoint-epoch10.pth}
  strict_checkpoint: true
  output_crop: [80, 100, 200, 266]
  output_normalization: positive_max

psf_bank_path: data/ref_psff_real/prepared_psfs_v1.npz
psf_keys: [45, 93, 17, 63, 49, 81, 25, 76]
beta: 4.0
fusion_kernel: 65
fusion_alpha: 1.0
hypothesis_batch_size: 1
normalization_eps: 1.0e-8
freeze_backbones: true

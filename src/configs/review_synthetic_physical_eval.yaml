defaults:
  - e01_psf_free_eval
  - override model: physical_unrolled_admm
  - override metrics: physical_replay
  - _self_

condition_name: synthetic-physical
psf_replay_mode: "true"

protocol:
  experiment: review-synthetic-physical-replay-v1
  information_regime: measurement + ${psf_replay_mode} PSF

model:
  output_crop: ${protocol.roi}

dataloader_builder:
  batch_size: 4
  return_psf: true
  return_replay_psf: true
  operator_prompt_mode: ${psf_replay_mode}
  num_workers: 4
  persistent_workers: false

inferencer:
  device: cuda
  device_tensors: [measurement, psf, target]
  from_pretrained: null
  skip_model_load: false

writer:
  run_name: review-synthetic-physical-${psf_replay_mode}
  group: coursework-review-synthetic-physical-replay-v1
  job_type: ${psf_replay_mode}
  tags: [synthetic, psf-aware, physical, unrolled-admm, psf-replay]
  log_images: false

hydra:
  run:
    dir: outputs/coursework_review_physics_v1_20260916/synthetic_replay/${writer.run_name}

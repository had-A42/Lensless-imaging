defaults:
  - e02_mask_scaling_screen
  - override scale_condition: finite_100
  - override model: physical_unrolled_admm
  - _self_

protocol:
  experiment: review-synthetic-physical-v1
  information_regime: measurement + exact corresponding PSF
  endpoint_policy: final 100k optimizer updates
  version: corrected-v1
  queue: coursework-review-physical-v1

model:
  output_crop: ${protocol.roi}

dataloader_builder:
  batch_size: 4
  train_steps: ${trainer.total_steps}
  validation_mask_count: 32
  validation_scenes_per_mask: 32
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  return_psf: true
  train_mask_seed: 42
  evaluation_mask_seed: 42

trainer:
  seed: 42
  device: cuda
  device_tensors: [measurement, psf, target]
  n_epochs: 10
  epoch_len: 10000
  total_steps: 100000
  evaluation_period: 10
  monitor: "off"
  early_stop: -1
  save_period: 10
  keep_last_checkpoints: 1
  skip_oom: false
  max_grad_norm: null
  amp:
    enabled: false
    dtype: bfloat16

optimizer:
  lr: 1.0e-4
  weight_decay: 0.0

lr_scheduler:
  T_max: ${trainer.total_steps}
  eta_min: 1.0e-6

writer:
  mode: offline
  group: coursework-review-synthetic-physical-v1
  job_type: ${condition_name}
  tags: [synthetic, psf-aware, physical, unrolled-admm, supervisor-review]
  log_checkpoints: false
  log_best_checkpoint_at_end: false
  log_images: false
  save_code: false
  log_git_state: false

hydra:
  run:
    dir: outputs/coursework_review_physics_v1_20260916/hydra/${writer.run_name}

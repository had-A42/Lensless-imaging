train:
  _target_: src.datasets.celeba.CelebASceneDataset
  root_dir: ${oc.env:CELEBA_ROOT,data/raw/celeba}
  splits_path: manifests/celeba_splits.json
  split: train
  split_seed: 42
  image_size: ${scene_size}
  superpixel_size: ${superpixel_size}
  crop_size: 178

validation:
  _target_: src.datasets.celeba.CelebASceneDataset
  root_dir: ${datasets.train.root_dir}
  splits_path: ${datasets.train.splits_path}
  split: validation
  split_seed: ${datasets.train.split_seed}
  image_size: ${scene_size}
  superpixel_size: ${superpixel_size}
  crop_size: ${datasets.train.crop_size}

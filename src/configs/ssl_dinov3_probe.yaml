defaults:
  - e02_mask_scaling_screen
  - initialization: dinov3_random
  - override scale_condition: finite_100
  - override model: psf_free_dinov3
  - _self_

initialization_name: ${initialization.name}

model_metadata:
  parameter_count: 29780451
  trainable_parameter_count: 1960323

official_checkpoint:
  model_id: facebook/dinov3-convnext-tiny-pretrain-lvd1689m
  repository: https://huggingface.co/facebook/dinov3-convnext-tiny-pretrain-lvd1689m
  revision: 10d30274b4d445111e2d5bf75ac93bbd94db274b
  license: DINOv3 License

model:
  local_snapshot_path: ${initialization.local_snapshot_path}
  pretrained_encoder: ${initialization.pretrained_encoder}
  freeze_encoder: true

dataloader_builder:
  batch_size: 4

writer:
  run_name: ssl-dinov3-${initialization_name}-${condition_name}-seed${trainer.seed}
  group: ssl-dinov3-01
  job_type: ${initialization_name}
  tags: [synthetic, psf-free, article-resolution, ssl, dinov3, frozen-probe]

hydra:
  run:
    dir: outputs/train/ssl-dinov3/${initialization_name}/${condition_name}/seed${trainer.seed}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/train/ssl-dinov3/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${initialization_name}/${condition_name}/seed${trainer.seed}

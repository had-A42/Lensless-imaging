defaults:
  - e02_mask_scaling_screen
  - initialization: sd_vae_random
  - override scale_condition: finite_100
  - override model: psf_free_sd_vae
  - _self_

initialization_name: ${initialization.name}

model_metadata:
  parameter_count: 83653863

official_checkpoint:
  model_id: stabilityai/sd-vae-ft-mse
  repository: https://huggingface.co/stabilityai/sd-vae-ft-mse
  revision: 31f26fdeee1355a5c34592e401dd41e45d25a493
  license: MIT

model:
  local_snapshot_path: ${initialization.local_snapshot_path}
  pretrained: ${initialization.pretrained}

dataloader_builder:
  batch_size: 1

writer:
  run_name: ae-sd-vae-${initialization_name}-${condition_name}-seed${trainer.seed}
  group: ae-sd-vae-01
  job_type: ${initialization_name}
  tags: [synthetic, psf-free, article-resolution, autoencoder, sd-vae]

hydra:
  run:
    dir: outputs/train/ae-sd-vae/${initialization_name}/${condition_name}/seed${trainer.seed}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/train/ae-sd-vae/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${initialization_name}/${condition_name}/seed${trainer.seed}

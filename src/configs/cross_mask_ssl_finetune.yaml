defaults:
  - e02_mask_scaling_screen
  - override scale_condition: finite_100
  - override model: psf_free_cross_mask_ssl
  - _self_

protocol:
  experiment: SSL-CROSS-MASK-01
  version: corrected-v1
  stage: supervised-finetune
  initialization: cross-mask-ssl-10k
  parent_checkpoint: ${trainer.from_pretrained}
  batch_size: 8
  scene_exposures: 80000

loss_function:
  _target_: src.loss.ReconstructionLoss
  mse_weight: 1.0
  ssim_weight: 0.0
  lpips_weight: 1.0
  lpips_net: vgg
  normalize_by_max: true

trainer:
  from_pretrained: ${oc.env:CROSS_MASK_SSL_CHECKPOINT,missing-cross-mask-ssl-checkpoint}
  n_epochs: 4
  epoch_len: 2500
  total_steps: 10000
  required_device_tensors:
    train: [measurement, target]
    inference: [measurement, target]
  amp:
    enabled: true
    dtype: bfloat16

lr_scheduler:
  T_max: ${trainer.total_steps}

dataloader_builder:
  paired_train: false
  batch_size: ${protocol.batch_size}
  cross_validation_steps: 0

writer:
  run_name: cross-mask-ssl-finetune-${condition_name}-seed${trainer.seed}
  group: cross-mask-ssl-01
  job_type: supervised-finetune
  tags: [synthetic, psf-free, article-resolution, ssl, cross-mask, finetune]
  loss_names: [loss, mse_loss, lpips_loss]

hydra:
  run:
    dir: outputs/train/cross-mask-ssl-finetune/${condition_name}/seed${trainer.seed}/${now:%Y-%m-%d_%H-%M-%S}

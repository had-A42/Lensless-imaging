defaults:
  - model: ohuf_published_k8
  - metrics: reconstruction
  - datasets: digicam_ohuf_confirmation
  - dataloader: reconstruction
  - transforms: reconstruction
  - _self_

condition_name: ohuf-published-k8-confirmation

protocol:
  status: development_smoke_reproduction
  measurement_shape: [3, 380, 507]
  target_shape: [3, 200, 266]
  roi: [80, 100, 200, 266]
  true_psf_available_to_model: false
  checkpoint_masks_are_held_out: false

provenance:
  experiment: OHUF-DEV-01
  dataset_repo: bezzam/DigiCam-Mirflickr-MultiMask-25K
  dataset_revision: 21d82b67662ed1e590a40c98688c32cb3c74f079
  dataset_split: train
  official_test_accessed: false
  expected_samples: 64
  expected_masks: 16
  expected_scenes_per_mask: 4

metrics:
  device: ${inferencer.device}

inferencer:
  device_tensors: [measurement, target]
  device: auto
  seed: 20260911
  output_type: reconstruction
  save_dir: saved
  save_path: ohuf-published-k8-confirmation
  from_pretrained: null
  skip_model_load: true
  override: false
  example_indices: [0, 15, 31, 47, 63]

dataloader:
  batch_size: 4
  num_workers: 0
  pin_memory: false

hydra:
  run:
    dir: outputs/inference/ohuf-published-k8/${now:%Y-%m-%d_%H-%M-%S}

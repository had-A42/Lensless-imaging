defaults:
  - mnist_reconstruction
  - _self_

classifier_checkpoint_path: ${oc.env:MNIST_CLASSIFIER_CHECKPOINT,outputs/coursework_mnist_reconstruction_accuracy_v3_20260912/classifier_final.pth}
classifier_checkpoint_sha256: 6fc3c79ba6a9608281dd68f2e18f52027da2b543941a3d8b41d0a5d7594a6b7b

inference:
  - _target_: src.metrics.PSNRMetric
    normalize_by_max: false
    name: PSNR
  - _target_: src.metrics.SSIMMetric
    normalize_by_max: false
    name: SSIM
  - _target_: src.metrics.PooledPSNRMetric
    pooling_factor: 8
    normalize_by_max: false
    name: PSNR_32
  - _target_: src.metrics.PooledSSIMMetric
    pooling_factor: 8
    normalize_by_max: false
    name: SSIM_32
  - _target_: src.metrics.LPIPSMetric
    net_type: vgg
    device: ${metrics.device}
    normalize_by_max: false
    name: LPIPS
  - _target_: src.metrics.PooledDiceLossMetric
    pooling_factor: 8
    name: Dice_loss_32
  - _target_: src.metrics.mnist.FixedMNISTClassifierAccuracyMetric
    checkpoint_path: ${metrics.classifier_checkpoint_path}
    expected_sha256: ${metrics.classifier_checkpoint_sha256}
    pooling_factor: 8
    name: Classifier_accuracy
  - _target_: src.metrics.mnist.FixedMNISTClassifierAccuracyMetric
    checkpoint_path: ${metrics.classifier_checkpoint_path}
    expected_sha256: ${metrics.classifier_checkpoint_sha256}
    pooling_factor: 8
    use_target: true
    name: Target_classifier_accuracy

device: "auto"

train:
  - _target_: src.metrics.PSNRMetric
    data_range: 1.0
    normalize_by_max: false
    name: "PSNR"
  - _target_: src.metrics.SSIMMetric
    data_range: 1.0
    normalize_by_max: false
    name: "SSIM"
  - _target_: src.metrics.PooledPSNRMetric
    pooling_factor: 8
    data_range: 1.0
    normalize_by_max: false
    name: "PSNR_32"
  - _target_: src.metrics.PooledSSIMMetric
    pooling_factor: 8
    data_range: 1.0
    normalize_by_max: false
    name: "SSIM_32"

inference: ${metrics.train}

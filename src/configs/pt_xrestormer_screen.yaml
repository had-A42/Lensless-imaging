defaults:
  - e02_mask_scaling_screen
  - initialization: xrestormer_scratch
  - override scale_condition: finite_100
  - override model: psf_free_xrestormer
  - _self_

initialization_name: ${initialization.name}

model_metadata:
  parameter_count: 26041208

official_checkpoint:
  repository: https://github.com/Andrew0613/X-Restormer
  revision: e096da6bf5f640f8a0d1fde3eec893ded1feac6f
  url: https://drive.google.com/file/d/1akQHXC-PFHgj9iayHxFOm_leSc9t4RBC/view
  sha256: 12c6f5c8053cdede1e37d442ebf0824817007c32214c1b51b29e50636db39354
  license: MIT

model:
  checkpoint_path: ${initialization.checkpoint_path}
  checkpoint_sha256: ${initialization.checkpoint_sha256}

dataloader_builder:
  batch_size: 1

writer:
  run_name: pt-xrestormer-${initialization_name}-${condition_name}-seed${trainer.seed}
  group: pretrain-pt-xrestormer-01
  job_type: ${initialization_name}
  tags: [synthetic, psf-free, article-resolution, pretrain, xrestormer, screen]

hydra:
  run:
    dir: outputs/train/pt-xrestormer/${initialization_name}/${condition_name}/seed${trainer.seed}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/train/pt-xrestormer/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${initialization_name}/${condition_name}/seed${trainer.seed}

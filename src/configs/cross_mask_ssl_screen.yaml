defaults:
  - e02_mask_scaling_screen
  - override scale_condition: finite_100
  - override model: psf_free_cross_mask_ssl
  - _self_

protocol:
  experiment: SSL-CROSS-MASK-01
  version: corrected-v1
  scope: clean-target-free cross-mask physics-consistency pretraining
  train_masks: 100
  scenes_per_step: 8
  views_per_scene: 2
  scene_exposures: 80000
  measurement_forwards: 160000
  roi: [80, 100, 200, 266]

loss_function:
  _target_: src.loss.CrossMaskPhysicsLoss
  roi: ${protocol.roi}
  view_weight: 0.1
  vicreg_weight: 0.01
  invariance_weight: 25.0
  variance_weight: 25.0
  covariance_weight: 1.0
  charbonnier_epsilon: 1.0e-6
  variance_epsilon: 1.0e-4
  collapse_threshold: 0.1

metrics:
  train: []

trainer:
  required_device_tensors:
    train: [measurement_a, measurement_b, psf_a, psf_b]
    inference: [measurement, target]
  amp:
    enabled: true
    dtype: bfloat16

dataloader_builder:
  paired_train: true
  batch_size: 8
  cross_validation_steps: 32
  psf_cache:
    mode: read_write
    warmup: true

writer:
  run_name: cross-mask-ssl-${condition_name}-seed${trainer.seed}
  group: cross-mask-ssl-01
  job_type: physics-pretraining
  tags: [synthetic, psf-free, article-resolution, ssl, cross-mask, physics]
  loss_names:
    - loss
    - self_loss
    - cross_loss
    - view_loss
    - vicreg_loss
    - invariance_loss
    - variance_loss
    - covariance_loss
    - embedding_std
    - collapsed_fraction
    - effective_rank
    - mse_loss
    - lpips_loss

hydra:
  run:
    dir: outputs/train/cross-mask-ssl/${condition_name}/seed${trainer.seed}/${now:%Y-%m-%d_%H-%M-%S}
